openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api/v1
    description: Versioned API path
tags:
  - name: health
    description: Health operations
  - name: setup
    description: Initial installation
  - name: auth
    description: Local authentication
  - name: dashboard
    description: Overview and system status
  - name: users
    description: User and role administration
  - name: catalog
    description: Official PIC catalogue
  - name: activities
    description: Captura, contraste y validación de actuaciones
  - name: documents
    description: Documentos y evidencias privadas
  - name: information
    description: Solicitudes mínimas de información
  - name: indicators
    description: Observaciones y cálculos trazables de indicadores
paths:
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: Check whether initial setup is required
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /setup/initialize:
    post:
      operationId: initializeSetup
      tags: [setup]
      summary: Create the first administrator, centre, and school year
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInitializeInput"
      responses:
        "201":
          description: Initial administrator created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          description: Setup is already complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a local account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "202":
          description: Generic response regardless of whether the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResponse"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Request limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      tags: [auth]
      summary: Set a new password using a one-time reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCompleteInput"
      responses:
        "200":
          description: Password changed and existing sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Reset token is invalid, expired, or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/password/change:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change own password and revoke other sessions
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "200":
          description: Password changed; current session retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResponse"
        "400":
          description: Invalid input or incorrect current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Password or session changed concurrently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many incorrect password attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current user and CSRF token
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get persisted centre and catalogue totals
      responses:
        "200":
          description: Dashboard counts from stored records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List accounts visible to the administrator
      responses:
        "200":
          description: User accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user with a least-privilege role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid account data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{userId}/family:
    post:
      operationId: updateUserFamily
      tags: [users]
      summary: Assign an official family to an existing account with concurrency control
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserFamilyInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid family assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account outside the administrator's center
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Assignment changed in another session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /staff/options:
    get:
      operationId: listStaffOptions
      tags: [users]
      summary: List active staff names and families for C2 assignments
      responses:
        "200":
          description: Minimal staff selector data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffOption"
  /catalogs/current:
    get:
      operationId: getCurrentCatalog
      tags: [catalog]
      summary: Get the imported official PIC catalogue
      responses:
        "200":
          description: Current catalogue and validation counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicCatalog"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/catalogs/import:
    post:
      operationId: importCatalog
      tags: [catalog]
      summary: Import and version an official PIC catalogue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogImportInput"
      responses:
        "201":
          description: Catalogue imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImportResult"
        "400":
          description: Catalogue does not pass validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Version already exists with different content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plans/current:
    get:
      operationId: getCurrentPicPlan
      tags: [pic]
      summary: Read the PIC draft for the active centre and year
      responses:
        "200":
          description: Current PIC plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicPlan"
        "404":
          description: No plan has been created for this year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCurrentPicPlan
      tags: [pic]
      summary: Create the first PIC draft for the active year
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicPlan"
        "409":
          description: A plan already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plans/{planId}:
    parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: savePicPlan
      tags: [pic]
      summary: Save PIC sections 1–10 with optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PicPlanWriteInput"
      responses:
        "200":
          description: Plan saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicPlan"
        "400":
          description: Invalid plan content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Plan changed by another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plans/{planId}/validation:
    get:
      operationId: validatePicPlan
      tags: [pic]
      summary: Validate official PIC completion rules
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicPlanValidation"
  /plans/{planId}/snapshot:
    post:
      operationId: createPicSnapshot
      tags: [pic]
      summary: Save an immutable, validated PIC snapshot
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PicSnapshotInput"
      responses:
        "201":
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicSnapshotResponse"
        "422":
          description: Plan has blocking validation issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicPlanValidation"
  /plans/{planId}/snapshots:
    get:
      operationId: listPicSnapshots
      tags: [pic]
      summary: List immutable PIC snapshots
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Snapshot metadata, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PicSnapshotSummary"
  /plans/{planId}/snapshots/{snapshotId}:
    get:
      operationId: getPicSnapshot
      tags: [pic]
      summary: Retrieve the immutable content of a PIC snapshot
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Snapshot content and original validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicSnapshotDetail"
        "404":
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plans/{planId}/submission:
    get:
      operationId: getPicSubmission
      tags: [pic]
      summary: Read the latest recorded Laycos submission
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Submission receipt metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicSubmissionResponse"
        "404":
          description: No submission has been recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: recordPicSubmission
      tags: [pic]
      summary: Record a manually completed Laycos submission with its proof
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PicSubmissionInput"
      responses:
        "201":
          description: Submission record stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicSubmissionResponse"
        "400":
          description: Evidence file or submission data is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: An immutable plan snapshot is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plans/{planId}/submission/{submissionId}/evidence:
    get:
      operationId: getPicSubmissionEvidence
      tags: [pic]
      summary: Download the stored Laycos submission proof
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Base64-encoded evidence file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicSubmissionEvidence"
        "404":
          description: Evidence not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plans/{planId}/exports/laycos:
    get:
      operationId: exportPicLaycos
      tags: [pic]
      summary: Prepare ordered field-by-field manual Laycos export
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ordered Laycos fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaycosExport"
  /plans/{planId}/exports/docx:
    get:
      operationId: exportPicDocx
      tags: [pic]
      summary: Generate editable PIC document
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Base64-encoded DOCX export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportFile"
  /plans/{planId}/exports/pdf:
    get:
      operationId: exportPicPdf
      tags: [pic]
      summary: Generate printable PIC document
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Base64-encoded PDF export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportFile"
  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: List activities within the user's permitted scope
      responses:
        "200":
          description: Activities and evidence summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
    post:
      operationId: createActivity
      tags: [activities]
      summary: Record an activity and link it to selected PIC indicators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityInput"
      responses:
        "201":
          description: New activity or deduplicated activity with the source attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityCreateResult"
        "400":
          description: Invalid activity data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Activity was changed or belongs to an incompatible scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /activities/{activityId}:
    parameters:
      - name: activityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getActivity
      tags: [activities]
      summary: Read an activity and its provenance
      responses:
        "200":
          description: Activity detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          description: Activity not found in the user's permitted scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateActivity
      tags: [activities]
      summary: Correct an activity using optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityInput"
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "409":
          description: Stale revision or validated activity requires C2 correction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /activities/{activityId}/confirm:
    post:
      operationId: confirmActivity
      tags: [activities]
      summary: Confirm the activity information or explicitly report no information
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmActivityInput"
      responses:
        "200":
          description: Confirmation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "409":
          description: Stale revision or invalid state transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /activities/{activityId}/validate:
    post:
      operationId: validateActivity
      tags: [activities]
      summary: Validate an evidenced activity as C2
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionInput"
      responses:
        "200":
          description: Activity validated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "409":
          description: Stale revision or activity does not meet validation requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /activities/{activityId}/discard:
    post:
      operationId: discardActivity
      tags: [activities]
      summary: Withdraw an activity without deleting its history
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionInput"
      responses:
        "200":
          description: Activity withdrawn and retained in history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "409":
          description: Stale revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents visible to the current user
      responses:
        "200":
          description: Visible document metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Store a private document version and evidence record
      parameters:
        - name: title
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: category
          in: query
          required: true
          schema:
            type: string
            enum: [evidencia, acta, informe, producto, otro]
        - name: professionalFamily
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: accessScope
          in: query
          required: true
          schema:
            type: string
            enum: [family, center, restricted]
        - name: activityId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: indicatorCode
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: fileName
          in: query
          required: true
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Private document and evidence stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid file, metadata, or signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /documents/{documentId}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Read document metadata and immutable versions
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Document and version history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetail"
        "404":
          description: Document not found in the user's permitted scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /documents/{documentId}/versions:
    post:
      operationId: addDocumentVersion
      tags: [documents]
      summary: Add a new immutable version; approved content is never overwritten
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-File-Name
          in: header
          required: false
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: New version stored and sent for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "409":
          description: Identical content already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /documents/{documentId}/versions/{version}/rescan:
    post:
      operationId: rescanDocumentVersion
      tags: [documents]
      summary: Owner or C2 retries quarantine scanning without changing stored bytes
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionInput"
      responses:
        "200":
          description: Scan recorded; unavailable or infected content remains quarantined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid request
        "403":
          description: Only the owner or C2 may retry
        "404":
          description: Document or version not found in permitted scope
        "409":
          description: Stale revision, scan already running, clean version, or stored integrity failure
  /documents/{documentId}/approve:
    post:
      operationId: approveDocument
      tags: [documents]
      summary: Approve the current document version after antivirus clearance
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionInput"
      responses:
        "200":
          description: Document approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "409":
          description: Version is unscanned, infected, or has changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /documents/{documentId}/access:
    post:
      operationId: setDocumentAccess
      tags: [documents]
      summary: Grant or revoke a named user's access to a restricted document
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAccessInput"
      responses:
        "200":
          description: Document access grant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: User or document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /documents/{documentId}/links:
    post:
      operationId: linkDocumentEvidence
      tags: [documents]
      summary: Link an existing evidence record to an activity and PIC indicator
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentEvidenceLinkInput"
      responses:
        "201":
          description: Evidence link stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Document or activity not found in the user's permitted scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /documents/{documentId}/versions/{version}/content:
    get:
      operationId: downloadDocumentVersion
      tags: [documents]
      summary: Download an authorized document version as an attachment
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Document bytes; never rendered inline
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Document or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /information-requests:
    get:
      operationId: listInformationRequests
      tags: [information]
      summary: List requests assigned to the current user or visible to C2
      responses:
        "200":
          description: Minimal information requests with latest response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InformationRequest"
    post:
      operationId: createInformationRequest
      tags: [information]
      summary: Request only still-missing information and reuse open requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInformationRequestInput"
      responses:
        "201":
          description: Request created or merged into an open request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InformationRequest"
        "400":
          description: No requested fields remain missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /information-requests/{requestId}/respond:
    post:
      operationId: respondToInformationRequest
      tags: [information]
      summary: Respond, explicitly report no information, or report not realized
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondInformationRequestInput"
      responses:
        "201":
          description: Response recorded for C2 review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InformationRequest"
        "403":
          description: Request is not assigned to this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /information-requests/{requestId}/validate:
    post:
      operationId: validateInformationResponse
      tags: [information]
      summary: Validate an information response and apply supported activity fields
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionInput"
      responses:
        "200":
          description: Response validated and history retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InformationRequest"
  /indicators/current:
    get:
      operationId: listCurrentIndicators
      tags: [indicators]
      summary: Read selected current-plan indicators with live evidence counts
      responses:
        "200":
          description: Selected indicators and their current traceable values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndicatorSummary"
        "404":
          description: No active PIC plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /indicators/{indicatorCode}/observations:
    post:
      operationId: createIndicatorObservation
      tags: [indicators]
      summary: Calculate or confirm an indicator with formula, evidence, and validator
      parameters:
        - name: indicatorCode
          in: path
          required: true
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIndicatorObservationInput"
      responses:
        "201":
          description: Immutable indicator observation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicatorObservation"
        "400":
          description: Observation is inconsistent with the official indicator type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A required evidence reference is missing or inaccessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /school-years:
    get:
      operationId: listSchoolYears
      responses:
        "200":
          description: Cursos del centro
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SchoolYear" } }
    post:
      operationId: openSchoolYear
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolYearOpening" }
      responses:
        "201":
          description: Curso abierto sin datos heredados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolYear" }
  /school-years/review:
    get:
      operationId: getSchoolYearReview
      responses:
        "200":
          description: Cuentas y asignaciones para revisión explícita
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SchoolYearAccount" } }
  /school-years/{yearId}/validation:
    get:
      operationId: validateSchoolYearClosure
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Validación previa al cierre, repetida dentro de la transacción de cierre
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolYearValidation" }
  /school-years/{yearId}/close:
    post:
      operationId: closeSchoolYear
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolYearClosure" }
      responses:
        "200":
          description: Cierre irreversible con expediente inmutable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolYear" }
  /school-years/{yearId}/history:
    get:
      operationId: getSchoolYearHistory
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Fuentes históricas autorizadas, nunca una nueva captura ni un logro del curso actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolYearHistory" }
components:
  schemas:
    SchoolYear:
      type: object
      required: [id, label, active, revision, closedAt, closeReason]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        active: { type: boolean }
        revision: { type: integer }
        closedAt: { type: [string, "null"], format: date-time }
        closeReason: { type: [string, "null"] }
    SchoolYearAssignment:
      type: object
      required: [userId, role, professionalFamily]
      properties:
        userId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/UserRole" }
        professionalFamily: { type: [string, "null"], maxLength: 200 }
    SchoolYearAccount:
      type: object
      required: [userId, name, role, professionalFamily, assigned]
      properties:
        userId: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        professionalFamily: { type: [string, "null"] }
        assigned: { type: boolean }
    SchoolYearOpening:
      type: object
      required: [label, previousYearId, expectedRevision, assignments, permissionsReviewed]
      properties:
        label: { type: string, pattern: '^\d{4}-\d{4}$' }
        previousYearId: { type: string, format: uuid }
        expectedRevision: { type: integer, minimum: 1 }
        assignments:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SchoolYearAssignment" }
        permissionsReviewed: { type: boolean }
    SchoolYearClosure:
      type: object
      required: [expectedRevision, confirmation, reason]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        confirmation: { type: string }
        reason: { type: string, minLength: 10, maxLength: 2000 }
    SchoolYearValidation:
      type: object
      required: [canClose, revision, blockers, warnings]
      properties:
        canClose: { type: boolean }
        revision: { type: integer }
        blockers: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
    SchoolYearSource:
      type: object
      required: [source, id, data]
      properties:
        source: { type: string }
        id: { type: string }
        data: { type: object, additionalProperties: {} }
    SchoolYearHistory:
      type: object
      required: [schoolYearId, label, closedAt, sourceHash, sources]
      properties:
        schoolYearId: { type: string }
        label: { type: string }
        closedAt: { type: string, format: date-time }
        sourceHash: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SchoolYearSource" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    SetupStatus:
      type: object
      properties:
        initialized:
          type: boolean
      required: [initialized]
    UserRole:
      type: string
      enum:
        - admin_tecnico
        - c2_innovacion
        - equipo_directivo
        - coordinacion_red
        - jefatura_departamento
        - profesorado
        - consulta_c1
        - consulta_auditora
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        professionalFamily:
          type: [string, "null"]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, email, name, role, active, createdAt]
    StaffOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        professionalFamily:
          type: [string, "null"]
      required: [id, name, role, professionalFamily]
    AuthSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
      required: [user, csrfToken]
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 1024
      required: [email, password]
    PasswordResetRequestInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required: [email]
    PasswordResetRequestResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
    PasswordResetCompleteInput:
      type: object
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200
        password:
          type: string
          minLength: 12
          maxLength: 1024
      required: [token, password]
    PasswordChangeInput:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
        password:
          type: string
          minLength: 12
          maxLength: 1024
      required: [currentPassword, password]
    PasswordChangeResponse:
      type: object
      properties:
        success:
          type: boolean
        noticeSent:
          type: boolean
      required: [success, noticeSent]
    SetupInitializeInput:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 160
        password:
          type: string
          minLength: 12
          maxLength: 1024
        centerName:
          type: string
          minLength: 1
          maxLength: 200
        schoolYear:
          type: string
          pattern: "^\\d{4}-\\d{4}$"
      required: [email, name, password, centerName, schoolYear]
    UpdateUserFamilyInput:
      type: object
      properties:
        professionalFamily:
          type: [string, "null"]
          minLength: 1
          maxLength: 160
        expectedFamily:
          type: [string, "null"]
      required: [professionalFamily, expectedFamily]
    CreateUserInput:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 160
        role:
          $ref: "#/components/schemas/UserRole"
        temporaryPassword:
          type: string
          minLength: 12
          maxLength: 1024
        professionalFamily:
          type: [string, "null"]
          maxLength: 120
      required: [email, name, role, temporaryPassword]
    DashboardSummary:
      type: object
      properties:
        centerName:
          type: string
        schoolYear:
          type: string
        userCount:
          type: integer
        objectiveCount:
          type: integer
        actionCount:
          type: integer
        indicatorCount:
          type: integer
        catalogVersion:
          type: string
      required:
        - centerName
        - schoolYear
        - userCount
        - objectiveCount
        - actionCount
        - indicatorCount
        - catalogVersion
    PicCatalogIndicator:
      type: object
      properties:
        id:
          type: string
        descripcion:
          type: string
        tipo:
          type: string
          enum: [booleano, porcentaje, numero, escala_1_5, revisar_unidad]
        minimo_normativo:
          type: [integer, "null"]
        metodo_calculo:
          type: string
        fuente_evidencia:
          type: string
        conteo:
          type: string
      required: [id, descripcion, tipo, minimo_normativo, metodo_calculo, fuente_evidencia, conteo]
    PicCatalogAction:
      type: object
      properties:
        codigo:
          type: string
        titulo:
          type: string
        obligatoria:
          type: boolean
        indicadores:
          type: array
          items:
            $ref: "#/components/schemas/PicCatalogIndicator"
      required: [codigo, titulo, obligatoria, indicadores]
    PicCatalogObjective:
      type: object
      properties:
        codigo:
          type: string
        titulo:
          type: string
        acciones:
          type: array
          items:
            $ref: "#/components/schemas/PicCatalogAction"
      required: [codigo, titulo, acciones]
    PicDafoCategory:
      type: object
      properties:
        categoria:
          type: string
        opciones:
          type: array
          items:
            type: string
      required: [categoria, opciones]
    PicDafoCategories:
      type: object
      properties:
        debilidades:
          type: array
          items:
            $ref: "#/components/schemas/PicDafoCategory"
        fortalezas:
          type: array
          items:
            $ref: "#/components/schemas/PicDafoCategory"
        amenazas:
          type: array
          items:
            $ref: "#/components/schemas/PicDafoCategory"
        oportunidades:
          type: array
          items:
            $ref: "#/components/schemas/PicDafoCategory"
      required: [debilidades, fortalezas, amenazas, oportunidades]
    PicCatalog:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
        estado:
          type: string
        fecha_corte:
          type: string
        fuente:
          type: string
        reglas:
          $ref: "#/components/schemas/PicCatalogRules"
        objetivos:
          type: array
          items:
            $ref: "#/components/schemas/PicCatalogObjective"
        familias_profesionales:
          type: array
          items:
            type: string
        ods_2030:
          type: array
          items:
            type: string
        ods_canarios:
          type: array
          items:
            type: string
        cargos_ciclope:
          type: array
          items:
            type: string
        dafo_categorias:
          $ref: "#/components/schemas/PicDafoCategories"
      required:
        - id
        - version
        - estado
        - fecha_corte
        - fuente
        - reglas
        - objetivos
        - familias_profesionales
        - ods_2030
        - ods_canarios
        - cargos_ciclope
        - dafo_categorias
    PicCatalogRules:
      type: object
      properties:
        objetivos:
          type: integer
        acciones_minimas_por_objetivo:
          type: integer
        acciones_obligatorias:
          type: array
          items:
            type: string
        otras_acciones_maximo:
          type: integer
        proyectos_maximo_formulario:
          type: integer
        dafo_por_cuadrante_minimo:
          type: integer
        dafo_por_cuadrante_maximo:
          type: integer
        reuniones_CICLOPE_minimo:
          type: integer
        plazo_pic:
          type: string
        plazo_memoria:
          type: string
        riesgo_numerico_positivo:
          type: boolean
        logrado_actualizable_solo_en_seguimiento:
          type: boolean
      required:
        - objetivos
        - acciones_minimas_por_objetivo
        - acciones_obligatorias
        - otras_acciones_maximo
        - proyectos_maximo_formulario
        - dafo_por_cuadrante_minimo
        - dafo_por_cuadrante_maximo
        - reuniones_CICLOPE_minimo
        - plazo_pic
        - plazo_memoria
        - riesgo_numerico_positivo
        - logrado_actualizable_solo_en_seguimiento
    PicPlanCoordinator:
      type: object
      properties:
        profile:
          type: string
          enum: [C1, C2]
        firstName:
          type: string
          maxLength: 120
        lastName:
          type: string
          maxLength: 180
        corporateEmail:
          type: string
          maxLength: 254
        phone:
          type: string
          maxLength: 40
        professionalFamily:
          type: string
      required: [profile, firstName, lastName, corporateEmail, phone, professionalFamily]
    PicPlanFamilyProfile:
      type: object
      properties:
        professionalFamily:
          type: string
          minLength: 1
          maxLength: 120
        levels:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [FP Básica, Grado Medio, Grado Superior, Cursos de especialización, "Ofertas parciales (Grados A, B, C, D)"]
        groupCount:
          type: integer
          minimum: 0
      required: [professionalFamily, levels, groupCount]
    PicPlanCenterProfile:
      type: object
      properties:
        professionalFamily:
          type: string
        levels:
          type: array
          items:
            type: string
            enum: [FP Básica, Grado Medio, Grado Superior, Cursos de especialización, "Ofertas parciales (Grados A, B, C, D)"]
        groupCount:
          type: integer
          minimum: 0
        familyProfiles:
          type: array
          description: Desglose por familia; niveles y grupos del centro se calculan en el servidor. Ausente en los PIC antiguos, que conservan sus datos originales.
          maxItems: 100
          items:
            $ref: "#/components/schemas/PicPlanFamilyProfile"
      required: [professionalFamily, levels, groupCount]
    PicDafoEntry:
      type: object
      properties:
        quadrant:
          type: string
          enum: [debilidades, fortalezas, amenazas, oportunidades]
        category:
          type: string
        situation:
          type: string
        customDetail:
          type: string
      required: [quadrant, category, situation]
    PicProjectInput:
      type: object
      properties:
        promoter:
          type: string
          enum: [Erasmus+, Ministerio, CaixaBank Dualiza, DGFPERE-Canarias, Propio del centro, Otro]
        name:
          type: string
