openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api/v1
    description: Versioned API path
tags:
  - name: health
    description: Health operations
  - name: setup
    description: Initial installation
  - name: auth
    description: Local authentication
  - name: dashboard
    description: Overview and system status
  - name: users
    description: User and role administration
  - name: catalog
    description: Official PIC catalogue
  - name: activities
    description: Captura, contraste y validación de actuaciones
  - name: documents
    description: Documentos y evidencias privadas
  - name: information
    description: Solicitudes mínimas de información
  - name: indicators
    description: Observaciones y cálculos trazables de indicadores
paths:
  /mail/overview:
    get:
      operationId: getMailOverview
      responses:
        "200":
          description: Bandeja y estado local del proveedor (sin contenido de mensajes)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailOverview"}
  /mail/threads/{threadId}:
    parameters:
      - in: path
        name: threadId
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getMailThread
      responses:
        "200":
          description: Hilo visible para el usuario
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailThreadDetail"}
  /mail/threads/{threadId}/reply:
    parameters:
      - in: path
        name: threadId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: replyToMailThread
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MailReplyInput"}
      responses:
        "201": {description: Respuesta guardada como borrador en el hilo existente}
  /mail/contacts:
    post:
      operationId: createMailContact
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MailContactInput"}
      responses:
        "201":
          description: Contacto institucional autorizado para el curso activo
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailContact"}
  /mail/contacts/{contactId}:
    parameters:
      - in: path
        name: contactId
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updateMailContact
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MailContactInput"}
      responses:
        "200":
          description: Contacto actualizado
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailContact"}
  /mail/templates:
    post:
      operationId: createMailTemplate
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MailTemplateInput"}
      responses:
        "201":
          description: Plantilla versionada del curso activo
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailTemplate"}
  /mail/templates/{templateId}:
    parameters:
      - in: path
        name: templateId
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updateMailTemplate
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MailTemplateInput"}
      responses:
        "200":
          description: Plantilla actualizada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailTemplate"}
  /mail/drafts:
    post:
      operationId: createMailDraft
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MailDraftInput"}
      responses:
        "201":
          description: Un mensaje privado individual por destinatario
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailDraftResult"}
  /mail/drafts/{messageId}/submit:
    parameters:
      - in: path
        name: messageId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: submitMailDraft
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "200": {description: El borrador pasa a revisión humana}
  /mail/drafts/{messageId}:
    parameters:
      - in: path
        name: messageId
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updateMailDraft
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MailDraftUpdateInput"}
      responses:
        "200": {description: Borrador del autor actualizado con control de revisión}
  /mail/drafts/{messageId}/approve:
    parameters:
      - in: path
        name: messageId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: approveMailDraft
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "200": {description: Aprobación humana registrada}
  /mail/drafts/{messageId}/send:
    parameters:
      - in: path
        name: messageId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: queueMailDraft
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MailRevisionInput"}
      responses:
        "200": {description: Incorporado a la cola persistente; el estado no implica entrega}
  /mail/threads/{threadId}/assign:
    parameters:
      - in: path
        name: threadId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: assignMailThread
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MailAssignInput"}
      responses:
        "200": {description: Hilo asignado a una cuenta activa del mismo centro y curso}
  /mail/threads/{threadId}/action:
    parameters:
      - in: path
        name: threadId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: updateMailThreadAction
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MailThreadActionInput"}
      responses:
        "200":
          description: Cambio de carpeta trazable y autorizado
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailThreadSummary"}
  /mail/attachments/{attachmentId}/approve:
    parameters:
      - in: path
        name: attachmentId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: approveMailAttachment
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "200": {description: Adjunto limpio revisado explícitamente por personal autorizado}
  /mail/attachments/{attachmentId}/download:
    parameters:
      - in: path
        name: attachmentId
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: downloadMailAttachment
      responses:
        "200":
          description: Archivo disponible solo tras análisis limpio y aprobación humana
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /admin/mail/provider-status:
    get:
      operationId: getAdminMailSettings
      responses:
        "200":
          description: Configuración técnica sin credenciales
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailAdminSettings"}
  /admin/mail/provider-status/verify:
    post:
      operationId: verifyAdminMailProvider
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "200":
          description: Estado real del dominio consultado en Resend; nunca modifica DNS
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailAdminSettings"}
  /admin/mail/settings:
    put:
      operationId: updateAdminMailSettings
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MailSettingsInput"}
      responses:
        "200":
          description: Configuración persistente actualizada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailAdminSettings"}
  /webhooks/resend:
    post:
      operationId: receiveResendWebhook
      description: Verifica firma Svix y evita reintentos y eventos duplicados
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResendWebhookBody"}
      responses:
        "200": {description: Evento autenticado registrado idempotentemente}
        "401": {description: "Firma ausente, incorrecta o caducada"}
        "413": {description: "Payload demasiado grande"}
  /ciclope:
    get:
      operationId: getCiclope
      responses:
        "200":
          description: Curso activo y coordinación autorizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiclopeOverview"
  /ciclope/policy:
    put:
      operationId: updateCiclopePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CiclopePolicyInput"
      responses:
        "200":
          description: Política institucional guardada
  /ciclope/meetings:
    post:
      operationId: createCiclopeMeeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CiclopeMeetingInput"
      responses:
        "201":
          description: Reunión preparada sin atribuir asistencia ni envío
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiclopeMeeting"
  /ciclope/meetings/{meetingId}:
    parameters:
      - in: path
        name: meetingId
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: updateCiclopeMeeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CiclopeMeetingInput"
      responses:
        "200":
          description: Nueva revisión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiclopeMeeting"
  /ciclope/meetings/{meetingId}/action:
    parameters:
      - in: path
        name: meetingId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: actCiclopeMeeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CiclopeActionInput"
      responses:
        "200":
          description: Transición auditada
  /ciclope/meetings/{meetingId}/versions:
    parameters:
      - in: path
        name: meetingId
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listCiclopeVersions
      responses:
        "200":
          description: Revisiones inmutables
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CiclopeVersion"}
  /ciclope/meetings/{meetingId}/export/{document}/{revision}/{format}:
    parameters:
      - in: path
        name: meetingId
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: format
        required: true
        schema: {type: string, enum: [docx, pdf]}
      - in: path
        name: revision
        required: true
        schema: {type: integer, minimum: 1}
      - in: path
        name: document
        required: true
        schema: {type: string, enum: [convocatoria, acta]}
    get:
      operationId: exportCiclopeMeeting
      responses:
        "200":
          description: Documento de la revisión indicada
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /ciclope/tasks/{taskId}/action:
    parameters:
      - in: path
        name: taskId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: actCiclopeTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CiclopeTaskActionInput"
      responses:
        "200":
          description: Tarea o aviso dirigido a la persona responsable
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: Check whether initial setup is required
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /setup/initialize:
    post:
      operationId: initializeSetup
      tags: [setup]
      summary: Create the first administrator, centre, and school year
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInitializeInput"
      responses:
        "201":
          description: Initial administrator created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          description: Setup is already complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a local account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "202":
          description: Generic response regardless of whether the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResponse"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Request limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      tags: [auth]
      summary: Set a new password using a one-time reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCompleteInput"
      responses:
        "200":
          description: Password changed and existing sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Reset token is invalid, expired, or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/password/change:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change own password and revoke other sessions
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "200":
          description: Password changed; current session retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResponse"
        "400":
          description: Invalid input or incorrect current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Password or session changed concurrently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many incorrect password attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current user and CSRF token
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get persisted centre and catalogue totals
      responses:
        "200":
          description: Dashboard counts from stored records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List accounts visible to the administrator
      responses:
        "200":
          description: User accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user with a least-privilege role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid account data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{userId}/family:
    post:
      operationId: updateUserFamily
      tags: [users]
      summary: Assign an official family to an existing account with concurrency control
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserFamilyInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid family assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account outside the administrator's center
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Assignment changed in another session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /staff/options:
    get:
      operationId: listStaffOptions
      tags: [users]
      summary: List active staff names and families for C2 assignments
      responses:
        "200":
          description: Minimal staff selector data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffOption"
  /catalogs/current:
    get:
      operationId: getCurrentCatalog
      tags: [catalog]
      summary: Get the imported official PIC catalogue
      responses:
        "200":
          description: Current catalogue and validation counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicCatalog"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/catalogs/import:
    post:
      operationId: importCatalog
      tags: [catalog]
      summary: Import and version an official PIC catalogue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogImportInput"
      responses:
        "201":
          description: Catalogue imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImportResult"
        "400":
          description: Catalogue does not pass validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Version already exists with different content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plans/current:
    get:
      operationId: getCurrentPicPlan
      tags: [pic]
      summary: Read the PIC draft for the active centre and year
      responses:
        "200":
          description: Current PIC plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicPlan"
        "404":
          description: No plan has been created for this year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCurrentPicPlan
      tags: [pic]
      summary: Create the first PIC draft for the active year
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicPlan"
        "409":
          description: A plan already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plans/{planId}:
    parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: savePicPlan
      tags: [pic]
      summary: Save PIC sections 1–10 with optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PicPlanWriteInput"
      responses:
        "200":
          description: Plan saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicPlan"
        "400":
