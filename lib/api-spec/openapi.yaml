            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondInformationRequestInput"
      responses:
        "201":
          description: Response recorded for C2 review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InformationRequest"
        "403":
          description: Request is not assigned to this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /information-requests/{requestId}/validate:
    post:
      operationId: validateInformationResponse
      tags: [information]
      summary: Validate an information response and apply supported activity fields
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionInput"
      responses:
        "200":
          description: Response validated and history retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InformationRequest"
  /indicators/current:
    get:
      operationId: listCurrentIndicators
      tags: [indicators]
      summary: Read selected current-plan indicators with live evidence counts
      responses:
        "200":
          description: Selected indicators and their current traceable values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndicatorSummary"
        "404":
          description: No active PIC plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /indicators/{indicatorCode}/observations:
    post:
      operationId: createIndicatorObservation
      tags: [indicators]
      summary: Calculate or confirm an indicator with formula, evidence, and validator
      parameters:
        - name: indicatorCode
          in: path
          required: true
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIndicatorObservationInput"
      responses:
        "201":
          description: Immutable indicator observation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicatorObservation"
        "400":
          description: Observation is inconsistent with the official indicator type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A required evidence reference is missing or inaccessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /school-years:
    get:
      operationId: listSchoolYears
      responses:
        "200":
          description: Cursos del centro
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SchoolYear" } }
    post:
      operationId: openSchoolYear
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolYearOpening" }
      responses:
        "201":
          description: Curso abierto sin datos heredados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolYear" }
  /school-years/review:
    get:
      operationId: getSchoolYearReview
      responses:
        "200":
          description: Cuentas y asignaciones para revisión explícita
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SchoolYearAccount" } }
  /school-years/{yearId}/validation:
    get:
      operationId: validateSchoolYearClosure
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Validación previa al cierre, repetida dentro de la transacción de cierre
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolYearValidation" }
  /school-years/{yearId}/close:
    post:
      operationId: closeSchoolYear
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolYearClosure" }
      responses:
        "200":
          description: Cierre irreversible con expediente inmutable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolYear" }
  /school-years/{yearId}/history:
    get:
      operationId: getSchoolYearHistory
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Fuentes históricas autorizadas, nunca una nueva captura ni un logro del curso actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolYearHistory" }
  /school-years/{yearId}/export:
    get:
      operationId: exportSchoolYear
      description: Descarga de solo lectura de la instantánea cerrada, sin archivos binarios ni rutas privadas. Comprueba la huella archivada y añade checksums del contenido público.
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Expediente JSON adjunto con manifiesto SHA-256
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolYearExport" }
        "400":
          description: Identificador no válido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Sesión requerida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Sin permiso actual o histórico
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Curso no encontrado en el centro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Curso no cerrado o integridad del archivo no verificable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /school-years/{yearId}/originals:
    get:
      operationId: exportSchoolYearOriginals
      description: Paquete ZIP separado de originales autorizados de la instantánea inmutable. Incluye expediente.json compatible e informe de incluidos, ausentes, checksum incorrecto y bloqueos de seguridad. Nunca incluye cuarentena ni rutas privadas. No sustituye una copia de seguridad.
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: ZIP con originales seguros disponibles e informe de omisiones, incluso si no hay originales disponibles
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401":
          description: Sesión requerida
        "403":
          description: Sin permiso actual o histórico
        "404":
          description: Curso no encontrado en el centro
        "409":
          description: Curso no cerrado o instantánea no verificable
        "413":
          description: El paquete supera el límite de 128 MiB o 2000 versiones
        "429":
          description: Ya se está preparando un paquete
components:
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: {type: string}
  schemas:
    CiclopePerson:
      type: object
      required: [id, name, email, role, professionalFamily]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
        role: {type: string}
        professionalFamily: {type: [string, "null"]}
    CiclopeParticipant:
      type: object
      required: [userId, formalRole, appointedOn, attendance]
      properties:
        name: {type: string}
        email: {type: string}
        professionalFamily: {type: [string, "null"]}
        userId: {type: string, format: uuid}
        formalRole: {type: string, minLength: 1, maxLength: 180}
        appointedOn: {type: [string, "null"], format: date}
        attendance: {type: string, enum: [pendiente, presente, ausente, excusada]}
    CiclopeAgreement:
      type: object
      required: [title, responsibleUserId, dueDate, remindersEnabled]
      properties:
        responsibleName: {type: string}
        title: {type: string, minLength: 1, maxLength: 1500}
        responsibleUserId: {type: string, format: uuid}
        dueDate: {type: string, format: date}
        remindersEnabled: {type: boolean}
    CiclopeAttachment:
      type: object
      required: [documentId, title, versionId, version, sha256, originalName, sizeBytes]
      properties:
        documentId: {type: string}
        title: {type: string}
        versionId: {type: string}
        version: {type: integer}
        sha256: {type: string}
        originalName: {type: string}
        sizeBytes: {type: integer}
    CiclopeMeetingInput:
      type: object
      required: [expectedRevision, kind, title, startsAt, endsAt, purpose, location, participants, agenda, notes, agreements, chairUserId, secretaryUserId, validatorUserIds, attachmentIds, externalSender, externalChecks]
      properties:
        expectedRevision: {type: integer, minimum: 0}
        kind: {type: string, enum: [ciclope, red_c1]}
        title: {type: string, minLength: 3, maxLength: 250}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        purpose: {type: string, minLength: 3, maxLength: 5000}
        location: {type: string, maxLength: 2000}
        participants:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/CiclopeParticipant"}
        agenda:
          type: array
          maxItems: 60
          items: {type: string, minLength: 1, maxLength: 2000}
        notes: {type: string, maxLength: 50000}
        agreements:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/CiclopeAgreement"}
        chairUserId: {type: [string, "null"], format: uuid}
        secretaryUserId: {type: [string, "null"], format: uuid}
        validatorUserIds:
          type: array
          maxItems: 20
          items: {type: string, format: uuid}
        attachmentIds:
          type: array
          maxItems: 30
          items: {type: string, format: uuid}
        pinnedAttachments:
          type: array
          items: {$ref: "#/components/schemas/CiclopeAttachment"}
        externalSender: {type: string, maxLength: 500}
        externalChecks:
          type: object
          required: [laycos, questionnaire, constituted]
          properties:
            laycos: {type: string, enum: [pendiente, verificado]}
            questionnaire: {type: string, enum: [pendiente, verificado]}
            constituted: {type: string, enum: [pendiente, verificado]}
    CiclopePolicyInput:
      type: object
      required: [expectedRevision, requireInstitutionalApproval, authorizedInternalChannel]
      properties:
        expectedRevision: {type: integer, minimum: 0}
        requireInstitutionalApproval: {type: boolean}
        authorizedInternalChannel: {type: boolean}
    CiclopePolicy:
      type: object
      required: [revision, requireInstitutionalApproval, authorizedInternalChannel]
      properties:
        revision: {type: integer}
        requireInstitutionalApproval: {type: boolean}
        authorizedInternalChannel: {type: boolean}
    CiclopeMeeting:
      type: object
      required: [id, revision, state, data, approvalRequested, approvedPolicyRevision, contributions]
      properties:
        id: {type: string}
        revision: {type: integer}
        state: {type: string, enum: [programada, convocada, celebrada, acta_borrador, acta_validada, cancelada]}
        data: {$ref: "#/components/schemas/CiclopeMeetingInput"}
        approvalRequested: {type: boolean}
        approvedPolicyRevision: {type: [integer, "null"]}
        contributions:
          type: array
          items: {type: string}
    CiclopeTask:
      type: object
      required: [id, meetingId, sourceVersionId, title, responsibleUserId, dueDate, remindersEnabled, completedAt]
      properties:
        id: {type: string}
        meetingId: {type: string}
        sourceVersionId: {type: string}
        title: {type: string}
        responsibleUserId: {type: string}
        dueDate: {type: string}
        remindersEnabled: {type: boolean}
        completedAt: {type: [string, "null"]}
    CiclopeNotice:
      type: object
      required: [id, meetingId, title, createdAt]
      properties:
        id: {type: string}
        meetingId: {type: string}
        title: {type: string}
        createdAt: {type: string}
    CiclopeOverview:
      type: object
      required: [schoolYearId, schoolYearLabel, canManage, canApprove, minimumMeetings, policy, people, meetings, tasks, notices]
      properties:
        schoolYearId: {type: string}
        schoolYearLabel: {type: string}
        canManage: {type: boolean}
        canApprove: {type: boolean}
        minimumMeetings: {type: integer}
        policy: {$ref: "#/components/schemas/CiclopePolicy"}
        people:
          type: array
          items: {$ref: "#/components/schemas/CiclopePerson"}
        meetings:
          type: array
          items: {$ref: "#/components/schemas/CiclopeMeeting"}
        tasks:
          type: array
          items: {$ref: "#/components/schemas/CiclopeTask"}
        notices:
          type: array
          items: {$ref: "#/components/schemas/CiclopeNotice"}
    CiclopeVersion:
      type: object
      required: [id, revision, content, createdAt, createdBy]
      properties:
        id: {type: string}
        revision: {type: integer}
        content: {$ref: "#/components/schemas/CiclopeMeeting"}
        createdAt: {type: string}
        createdBy: {type: string}
    MailSettings:
      type: object
      required: [centerId, sendEnabled, revision, senderAlias, replyTo, sendApprovalRequired]
      properties:
        centerId: {type: string}
        sendEnabled: {type: boolean}
        revision: {type: integer}
        senderAlias: {type: string, enum: [innovacion, ciclope, proyectos]}
        replyTo: {type: string}
        sendApprovalRequired: {type: boolean}
    MailDomainRecord:
      type: object
      required: [type, name, value, status]
      properties:
        type: {type: string}
        name: {type: string}
        value: {type: string}
        status: {type: string}
        priority: {type: integer, nullable: true}
    MailProviderStatus:
      type: object
      required: [keyConfigured, webhookConfigured, deploymentEnabled, activationConfirmed, domain, domainVerified, domainStatus, records]
      properties:
        keyConfigured: {type: boolean}
        webhookConfigured: {type: boolean}
        deploymentEnabled: {type: boolean}
        activationConfirmed: {type: boolean}
        domain: {type: string}
        domainVerified: {type: boolean}
        domainStatus: {type: string}
        records:
          type: array
          items: {$ref: "#/components/schemas/MailDomainRecord"}
    MailPublicDnsStatus:
      type: object
      required: [rootMx, spf, dkim, dmarc, inboundMx, ready, checkedAt]
      properties:
        rootMx:
          type: array
          items: {type: string}
        spf: {type: string}
        dkim: {type: string}
        dmarc: {type: string}
        inboundMx:
          type: array
          items: {type: string}
        ready: {type: boolean}
        checkedAt: {type: string, format: date-time}
    MailAdminSettings:
      type: object
      required: [settings, provider, dns]
      properties:
        settings: {$ref: "#/components/schemas/MailSettings"}
        provider: {$ref: "#/components/schemas/MailProviderStatus"}
        lastDomainCheck: {type: string, nullable: true}
        lastDomainStatus: {type: string}
        dns: {$ref: "#/components/schemas/MailPublicDnsStatus"}
        domainRecords:
          type: array
          items: {$ref: "#/components/schemas/MailDomainRecord"}
    MailSettingsInput:
      type: object
      required: [expectedRevision, sendEnabled, senderAlias, replyTo]
      properties:
        expectedRevision: {type: integer, minimum: 1}
        sendEnabled: {type: boolean}
        senderAlias: {type: string, enum: [innovacion, ciclope, proyectos]}
        replyTo: {type: string, maxLength: 250}
    MailRevisionInput:
      type: object
      required: [expectedRevision]
      properties: {expectedRevision: {type: integer, minimum: 1}}
    MailAssignInput:
      type: object
      required: [userId]
      properties: {userId: {type: string, format: uuid}}
    ResendWebhookBody:
      type: object
      required: [type, data]
      properties:
        type: {type: string}
        data: {type: object}
    MailContact:
      type: object
      required: [id, email, displayName, segment, professionalFamily, institution, authorizationNote, optOut, active]
      properties:
        id: {type: string}
        email: {type: string}
        displayName: {type: string}
        segment: {type: string}
        professionalFamily: {type: string, nullable: true}
        institution: {type: string, nullable: true}
        authorizationNote: {type: string}
        optOut: {type: boolean}
        active: {type: boolean}
    MailContactInput:
      type: object
      required: [email, displayName, segment, authorizationNote, optOut, active]
      properties:
        email: {type: string, format: email, maxLength: 254}
        displayName: {type: string, minLength: 1, maxLength: 160}
        segment: {type: string, enum: [direccion, jefatura, profesorado, empresa, coordinacion_c1, centro, familia, otro]}
        professionalFamily: {type: string, maxLength: 160, nullable: true}
        institution: {type: string, maxLength: 200, nullable: true}
        authorizationNote: {type: string, minLength: 4, maxLength: 1000}
        optOut: {type: boolean}
        active: {type: boolean}
    MailTemplate:
      type: object
      required: [id, name, subject, body, classification, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        subject: {type: string}
        body: {type: string}
        classification: {type: string, enum: [obligatoria, organizativa, informativa, difusion]}
        updatedAt: {type: string}
    MailTemplateInput:
      type: object
      required: [name, subject, body, classification]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        subject: {type: string, minLength: 1, maxLength: 250}
        body: {type: string, minLength: 1, maxLength: 20000}
        classification: {type: string, enum: [obligatoria, organizativa, informativa, difusion]}
    MailThreadSummary:
      type: object
      required: [id, subject, topic, priority, folder, assignedTo, contactName, contactEmail, updatedAt, revision, lastStatus, preview]
      properties:
        id: {type: string}
        subject: {type: string}
        topic: {type: string}
        priority: {type: string}
        folder: {type: string}
        assignedTo: {type: string, nullable: true}
        contactName: {type: string}
        contactEmail: {type: string}
        updatedAt: {type: string}
        revision: {type: integer}
        lastStatus: {type: string}
        preview: {type: string}
    MailMessage:
      type: object
      required: [id, direction, status, sender, recipient, subject, bodyText, classification, createdAt, revision, attachments, createdBy]
      properties:
        id: {type: string}
        direction: {type: string}
        status: {type: string}
        sender: {type: string}
        recipient: {type: string}
        senderName: {type: string, nullable: true}
        cc: {type: string, nullable: true}
        replyTo: {type: string, nullable: true}
        subject: {type: string}
        bodyText: {type: string}
        classification: {type: string}
        approvedBy: {type: string, nullable: true}
        approvedAt: {type: string, nullable: true}
        sentAt: {type: string, nullable: true}
        deliveredAt: {type: string, nullable: true}
        createdAt: {type: string}
        revision: {type: integer}
        attempts: {type: integer}
        lastError: {type: string, nullable: true}
        createdBy: {type: string, nullable: true}
        attachments:
          type: array
          items: {type: object}
    MailThreadDetail:
      type: object
      required: [thread, messages]
      properties:
        thread: {$ref: "#/components/schemas/MailThreadSummary"}
        messages:
          type: array
          items: {$ref: "#/components/schemas/MailMessage"}
    MailOverview:
      type: object
      required: [yearLabel, canManage, canApprove, settings, provider, contacts, templates, threads]
      properties:
        yearLabel: {type: string}
        canManage: {type: boolean}
        canApprove: {type: boolean}
        settings: {$ref: "#/components/schemas/MailSettings"}
        provider: {$ref: "#/components/schemas/MailProviderStatus"}
        contacts:
          type: array
          items: {$ref: "#/components/schemas/MailContact"}
        templates:
          type: array
          items: {$ref: "#/components/schemas/MailTemplate"}
        threads:
          type: array
          items: {$ref: "#/components/schemas/MailThreadSummary"}
    MailDraftInput:
      type: object
      required: [recipientContactIds, subject, bodyText, classification, attachmentDocumentIds]
      properties:
        recipientContactIds:
          type: array
          minItems: 1
          maxItems: 50
          items: {type: string, format: uuid}
        templateId: {type: string, format: uuid, nullable: true}
        subject: {type: string, minLength: 1, maxLength: 250}
        bodyText: {type: string, minLength: 1, maxLength: 20000}
        classification: {type: string, enum: [obligatoria, organizativa, informativa, difusion]}
        attachmentDocumentIds:
          type: array
          maxItems: 10
          items: {type: string, format: uuid}
    MailDraftUpdateInput:
      type: object
      required: [expectedRevision, subject, bodyText, classification, attachmentDocumentIds]
      properties:
        expectedRevision: {type: integer, minimum: 1}
        subject: {type: string, minLength: 1, maxLength: 250}
        bodyText: {type: string, minLength: 1, maxLength: 20000}
        classification: {type: string, enum: [obligatoria, organizativa, informativa, difusion]}
        attachmentDocumentIds:
          type: array
          maxItems: 10
          items: {type: string, format: uuid}
    MailThreadActionInput:
      type: object
      required: [action]
      properties: {action: {type: string, enum: [archivar, recuperar, revisar]}}
    MailReplyInput:
      type: object
      required: [bodyText, classification, attachmentDocumentIds]
      properties:
        bodyText: {type: string, minLength: 1, maxLength: 20000}
        classification: {type: string, enum: [obligatoria, organizativa, informativa, difusion]}
        attachmentDocumentIds:
          type: array
          maxItems: 10
          items: {type: string, format: uuid}
    MailDraftResult:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: {$ref: "#/components/schemas/MailMessage"}
    CiclopeActionInput:
      type: object
      required: [expectedRevision, action]
      properties:
        expectedRevision: {type: integer, minimum: 1}
        action: {type: string, enum: [solicitar_refrendo, aprobar_convocatoria, convocar, celebrar, preparar_acta, validar_acta, cancelar, aportar]}
        text: {type: string, maxLength: 5000}
    CiclopeTaskActionInput:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [completar, reabrir, activar_recordatorios, desactivar_recordatorios, recordar]}
    SchoolYearExport:
      type: object
      required: [format, version, schoolYear, archive, manifest, content]
      properties:
        format: { type: string }
        version: { type: integer }
        schoolYear:
          type: object
          required: [id, label, closedAt]
          properties:
            id: { type: string, format: uuid }
            label: { type: string }
            closedAt: { type: string, format: date-time }
        archive:
          type: object
          required: [sourceHash, capturedAt, verified, verification]
          properties:
            sourceHash: { type: string }
            capturedAt: { type: string, format: date-time }
            verified: { type: boolean }
            verification: { type: string }
        manifest:
          type: object
          required: [algorithm, serialization, scope, contentSha256, sources]
          properties:
            algorithm: { type: string }
            serialization: { type: string }
            scope: { type: string }
            contentSha256: { type: string }
            sources:
              type: array
              items:
                type: object
                required: [index, source, id, sha256]
                properties:
                  index: { type: integer }
                  source: { type: string }
                  id: { type: string }
                  sha256: { type: string }
        content: { type: object, additionalProperties: {} }
    SchoolYear:
      type: object
      required: [id, label, active, revision, closedAt, closeReason]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        active: { type: boolean }
        revision: { type: integer }
        closedAt: { type: [string, "null"], format: date-time }
        closeReason: { type: [string, "null"] }
    SchoolYearAssignment:
      type: object
      required: [userId, role, professionalFamily]
      properties:
        userId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/UserRole" }
        professionalFamily: { type: [string, "null"], maxLength: 200 }
    SchoolYearAccount:
      type: object
      required: [userId, name, role, professionalFamily, assigned]
      properties:
