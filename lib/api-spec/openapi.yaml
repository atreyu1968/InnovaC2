          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: category
          in: query
          required: true
          schema:
            type: string
            enum: [evidencia, acta, informe, producto, otro]
        - name: professionalFamily
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: accessScope
          in: query
          required: true
          schema:
            type: string
            enum: [family, center, restricted]
        - name: activityId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: indicatorCode
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: fileName
          in: query
          required: true
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Private document and evidence stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
